<svg xmlns="http://www.w3.org/2000/svg" width="800" height="366" viewBox="0 0 800 366" role="img">
<style>
    text { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    .t { animation-fill-mode: backwards; }
    @keyframes type { from { width: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce) { .t, .blink { animation: none !important; } }
    
    </style>
<rect x=".5" y=".5" width="799" height="365" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="28" y="46" font-size="22" font-weight="700" fill="#e6edf3">ShoeStore</text>
<text x="772" y="45" text-anchor="end" font-size="12" fill="#8b949e">ASP.NET Core, Kotlin</text>
<text x="28" y="72" font-size="13.5" fill="#8b949e">E-commerce backend and Android app. Two buyers, one pair left: only one order wins.</text>
<rect x="28" y="92" width="744" height="200" rx="10" fill="#161b22" stroke="#30363d"/><text x="44" y="114" font-size="11" fill="#8b949e">variant stock = 1, version v7, both checkouts start at the same time</text>
<text x="46" y="152" font-size="12.5" font-weight="700" fill="#e6edf3">buyer A</text>
<rect x="110.0" y="136" width="52.0" height="24" rx="6" fill="#1c2330" stroke="#30363d"/><text x="136.0" y="151.8" text-anchor="middle" font-size="11" font-weight="400" fill="#e6edf3">BEGIN</text>
<rect x="174.0" y="136" width="70.0" height="24" rx="6" fill="#1c2330" stroke="#30363d"/><text x="209.0" y="151.8" text-anchor="middle" font-size="11" font-weight="400" fill="#e6edf3">read v7</text>
<rect x="256.0" y="136" width="76.0" height="24" rx="6" fill="#1c2330" stroke="#30363d"/><text x="294.0" y="151.8" text-anchor="middle" font-size="11" font-weight="400" fill="#e6edf3">stock -1</text>
<rect x="344.0" y="136" width="126.0" height="24" rx="6" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".7"/><text x="407.0" y="151.8" text-anchor="middle" font-size="11" font-weight="700" fill="#3fb950">COMMIT v7&gt;v8</text>
<rect x="482.0" y="136" width="97.2" height="24" rx="6" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".7"/><text x="530.6" y="151.8" text-anchor="middle" font-size="11" font-weight="700" fill="#3fb950">order placed</text>
<text x="46" y="200" font-size="12.5" font-weight="700" fill="#e6edf3">buyer B</text>
<rect x="110.0" y="184" width="52.0" height="24" rx="6" fill="#1c2330" stroke="#30363d"/><text x="136.0" y="199.8" text-anchor="middle" font-size="11" font-weight="400" fill="#e6edf3">BEGIN</text>
<rect x="174.0" y="184" width="70.0" height="24" rx="6" fill="#1c2330" stroke="#30363d"/><text x="209.0" y="199.8" text-anchor="middle" font-size="11" font-weight="400" fill="#e6edf3">read v7</text>
<rect x="256.0" y="184" width="76.0" height="24" rx="6" fill="#1c2330" stroke="#30363d"/><text x="294.0" y="199.8" text-anchor="middle" font-size="11" font-weight="400" fill="#e6edf3">stock -1</text>
<rect x="344.0" y="184" width="126.0" height="24" rx="6" fill="#d29922" fill-opacity=".14" stroke="#d29922" stroke-opacity=".7"/><text x="407.0" y="199.8" text-anchor="middle" font-size="11" font-weight="700" fill="#d29922">v7 changed</text>
<rect x="482.0" y="184" width="51.0" height="24" rx="6" fill="#1c2330" stroke="#30363d"/><text x="507.5" y="199.8" text-anchor="middle" font-size="11" font-weight="400" fill="#e6edf3">retry</text>
<rect x="545.0" y="184" width="123.6" height="24" rx="6" fill="#f85149" fill-opacity=".14" stroke="#f85149" stroke-opacity=".7"/><text x="606.8" y="199.8" text-anchor="middle" font-size="11" font-weight="700" fill="#f85149">409 StockChanged</text>
<line x1="46" y1="232" x2="754" y2="232" stroke="#30363d"/>
<text x="46" y="258" font-size="12" fill="#8b949e" xml:space="preserve"><tspan fill="#d29922">Checkout.Concurrency</tspan>: retry with exponential backoff and jitter, then re-read stock</text>
<text x="46" y="278" font-size="12" fill="#8b949e">Version tokens on variants and vouchers, one 4-step transaction</text>
<rect x="28" y="310" width="6" height="6" rx="1.5" fill="#3fb950"/><text x="44" y="318" font-size="12.5" fill="#e6edf3">QR payment through a SePay webhook, pushed to the Android app over SignalR</text>
<rect x="28.0" y="330" width="98.8" height="22" rx="5" fill="#1c2330"/><text x="77.4" y="345" text-anchor="middle" font-size="11.5" fill="#8b949e">ASP.NET Core</text><rect x="134.8" y="330" width="64.3" height="22" rx="5" fill="#1c2330"/><text x="167.0" y="345" text-anchor="middle" font-size="11.5" fill="#8b949e">EF Core</text><rect x="207.1" y="330" width="85.0" height="22" rx="5" fill="#1c2330"/><text x="249.6" y="345" text-anchor="middle" font-size="11.5" fill="#8b949e">PostgreSQL</text><rect x="300.1" y="330" width="64.3" height="22" rx="5" fill="#1c2330"/><text x="332.2" y="345" text-anchor="middle" font-size="11.5" fill="#8b949e">SignalR</text><rect x="372.4" y="330" width="57.4" height="22" rx="5" fill="#1c2330"/><text x="401.1" y="345" text-anchor="middle" font-size="11.5" fill="#8b949e">Kotlin</text><rect x="437.8" y="330" width="119.5" height="22" rx="5" fill="#1c2330"/><text x="497.6" y="345" text-anchor="middle" font-size="11.5" fill="#8b949e">Jetpack Compose</text>
