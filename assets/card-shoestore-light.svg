<svg xmlns="http://www.w3.org/2000/svg" width="800" height="282" viewBox="0 0 800 282" role="img">
<style>
    text { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    .t { animation-fill-mode: backwards; }
    @keyframes type { from { width: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { stroke-opacity: .35; } 8%, 16% { stroke-opacity: 1; } 28% { stroke-opacity: .35; } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce) { .t, .blink, .pulse { animation: none !important; } }
    
    </style>
