<text x="772" y="44" text-anchor="end" font-size="12" fill="#59636e">ASP.NET Core, Kotlin</text>
<text x="28" y="68" font-size="13" fill="#59636e">E-commerce backend and Android app. QR payment confirmed by webhook, stock kept consistent.</text>
