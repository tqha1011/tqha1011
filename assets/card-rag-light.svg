<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img">
<style>
    text { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    .t { animation-fill-mode: backwards; }
    @keyframes type { from { width: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce) { .t, .blink { animation: none !important; } }
    
    </style>
<rect x=".5" y=".5" width="799" height="359" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="28" y="46" font-size="22" font-weight="700" fill="#1f2328">smart-knowledge-hub-backend</text>
<text x="772" y="45" text-anchor="end" font-size="12" fill="#59636e">NestJS, TypeScript</text>
<text x="28" y="72" font-size="13.5" fill="#59636e">Multi-workspace knowledge base. Ask your documents a question, get an answer with sources.</text>
<rect x="28" y="92" width="744" height="192" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="44" y="114" font-size="11" fill="#59636e">example query</text>
<text x="46" y="144" font-size="15" font-weight="700" fill="#1a7f37">?</text>
<text x="64" y="144" font-size="14.5" font-weight="700" fill="#1f2328">What is the refund policy for annual plans?</text>
<line x1="46" y1="160" x2="754" y2="160" stroke="#d0d7de"/>
<text x="46" y="186" font-size="13.5" fill="#1f2328">Annual plans can be refunded within 30 days of purchase.</text>
<text x="46" y="207" font-size="13.5" fill="#59636e">After that, the remaining months are prorated.</text>
<text x="46" y="236" font-size="11.5" fill="#59636e">sources</text>
<rect x="108.0" y="220" width="135.3" height="24" rx="6" fill="#1a7f37" fill-opacity=".14" stroke="#1a7f37" stroke-opacity=".7"/><text x="175.7" y="236.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a7f37">refund-policy.pdf</text>
<rect x="253.3" y="220" width="114.6" height="24" rx="6" fill="#1a7f37" fill-opacity=".14" stroke="#1a7f37" stroke-opacity=".7"/><text x="310.6" y="236.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a7f37">billing-faq.md</text>
<text x="46" y="262" font-size="11.5" xml:space="preserve"><tspan fill="#59636e" font-weight="400">upload</tspan><tspan fill="#d0d7de">  >  </tspan><tspan fill="#59636e" font-weight="400">queue</tspan><tspan fill="#d0d7de">  >  </tspan><tspan fill="#59636e" font-weight="400">chunk</tspan><tspan fill="#d0d7de">  >  </tspan><tspan fill="#59636e" font-weight="400">embed</tspan><tspan fill="#d0d7de">  >  </tspan><tspan fill="#1a7f37" font-weight="700">pgvector search</tspan><tspan fill="#d0d7de">  >  </tspan><tspan fill="#59636e" font-weight="400">answer</tspan></text>
<rect x="28" y="306" width="6" height="6" rx="1.5" fill="#1a7f37"/><text x="44" y="314" font-size="12.5" fill="#1f2328">Retrieval only sees documents the caller may access; every chunk is rechecked before use</text>
<rect x="28.0" y="324" width="57.4" height="22" rx="5" fill="#eaeef2"/><text x="56.7" y="339" text-anchor="middle" font-size="11.5" fill="#59636e">NestJS</text><rect x="93.4" y="324" width="85.0" height="22" rx="5" fill="#eaeef2"/><text x="135.9" y="339" text-anchor="middle" font-size="11.5" fill="#59636e">PostgreSQL</text><rect x="186.4" y="324" width="71.2" height="22" rx="5" fill="#eaeef2"/><text x="222.0" y="339" text-anchor="middle" font-size="11.5" fill="#59636e">pgvector</text><rect x="265.6" y="324" width="50.5" height="22" rx="5" fill="#eaeef2"/><text x="290.9" y="339" text-anchor="middle" font-size="11.5" fill="#59636e">Redis</text><rect x="324.1" y="324" width="57.4" height="22" rx="5" fill="#eaeef2"/><text x="352.8" y="339" text-anchor="middle" font-size="11.5" fill="#59636e">BullMQ</text><rect x="389.5" y="324" width="78.1" height="22" rx="5" fill="#eaeef2"/><text x="428.6" y="339" text-anchor="middle" font-size="11.5" fill="#59636e">Socket.IO</text><rect x="475.6" y="324" width="57.4" height="22" rx="5" fill="#eaeef2"/><text x="504.3" y="339" text-anchor="middle" font-size="11.5" fill="#59636e">Gemini</text><rect x="541.0" y="324" width="43.6" height="22" rx="5" fill="#eaeef2"/><text x="562.8" y="339" text-anchor="middle" font-size="11.5" fill="#59636e">Groq</text>
</svg>
