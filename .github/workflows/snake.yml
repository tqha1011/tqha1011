name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" 
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: generate-snake-game
        uses: Platane/snk@v3
        with:
          github_user_name: tqha1011
          outputs: |
            dist/github-snake.svg?color_snake=#3438E8&color_dots=#E4E6F7,#C3C6F5,#9296F0,#5F64EC,#3438E8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#8A8FFF&color_dots=#1B1A36,#2A2D78,#3F44B8,#5F64EC,#8A8FFF
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9&color_background=#aaaaaa

      - name: push-to-output-branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          # Đảm bảo bạn đã tạo Secret tên là GH_TOKEN trong Settings
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
